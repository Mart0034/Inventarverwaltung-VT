<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fundus</title>
<meta name="description" content="Inventar- und Vermietungsverwaltung für Veranstaltungstechnik">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#364786">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fundus">
<script>
  // Applied synchronously, before the stylesheet, so a saved light/dark
  // choice takes effect on first paint instead of flashing the system
  // theme first. No value stored (or "system") means fall back to the
  // prefers-color-scheme media query in styles.css, same as before.
  (function(){
    var t = localStorage.getItem('fundus-theme');
    if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
